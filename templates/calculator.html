<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retirement Gap Analysis</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            max-width: 800px;
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
            padding: 40px;
            transition: all 0.3s ease;
        }
        .header-text {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
        }
        .header-text h1 { font-size: 2.2em; margin-bottom: 10px; }
        .header-text p { color: #666; font-size: 1.1em; }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .primary-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
            margin-top: 10px;
        }
        .primary-btn:hover { transform: translateY(-2px); }
        .secondary-btn {
            width: 100%;
            background: #f8f9fa;
            color: #2c3e50;
            border: 2px solid #e9ecef;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
        }

        /* Results Screen Specifics */
        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 30px 0;
        }
        .result-card {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            border-top: 5px solid #667eea;
        }
        .result-card h3 { color: #666; font-size: 1.1em; margin-bottom: 10px; }
        .result-card .amount { font-size: 2em; font-weight: bold; color: #2c3e50; }
        
        .gap-alert {
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        .gap-alert.warning { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .gap-alert.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }

        @media (max-width: 600px) {
            .form-row, .results-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- PHASE 1: The Input Form -->
        <div id="step1">
            <div class="header-text">
                <h1>Let's map out your future.</h1>
                <p>Answer a few quick questions to see if you are on track for retirement.</p>
            </div>

            <form id="gapForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" id="name" required placeholder="e.g. Sarah">
                    </div>
                    <div class="form-group">
                        <label>Current Yearly Income ($)</label>
                        <input type="number" id="yearly_income" required placeholder="100000">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Current Age</label>
                        <input type="number" id="age_current" required placeholder="35">
                    </div>
                    <div class="form-group">
                        <label>Target Retirement Age</label>
                        <input type="number" id="age_retire" required placeholder="65">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Current Savings / Portfolio ($)</label>
                        <input type="number" id="portfolio_total" required placeholder="50000">
                    </div>
                    <div class="form-group">
                        <label>Expected Monthly Benefits ($)</label>
                        <input type="number" id="monthly_benefits" required placeholder="2000">
                    </div>
                </div>

                <button type="submit" class="primary-btn">Calculate My Outlook</button>
            </form>
        </div>

        <!-- PHASE 2: The Results Reveal -->
        <div id="step2" style="display: none;">
            <div class="header-text">
                <h1 id="greeting">Here is your outlook.</h1>
                <p>Based on inflation and projected market returns by age <span id="display-age"></span>.</p>
            </div>

            <div class="results-grid">
                <div class="result-card">
                    <h3>Target Annual Income</h3>
                    <div class="amount" id="target-income">$0</div>
                </div>
                <div class="result-card">
                    <h3>Projected Annual Income</h3>
                    <div class="amount" id="projected-income">$0</div>
                </div>
            </div>

            <div id="gap-message" class="gap-alert warning">
                <!-- Javascript will inject the shortfall/surplus message here -->
            </div>

            <button class="primary-btn" onclick="alert('Advanced tools coming soon!')">Optimize My Strategy</button>
            <button class="secondary-btn" onclick="goBack()">Recalculate</button>
        </div>

    </div>

    <script>
        // Formatter to turn 167805.40 into $167,805
        const currency = new Intl.NumberFormat('en-US', {
            style: 'currency',
            currency: 'USD',
            maximumFractionDigits: 0
        });

        document.getElementById('gapForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Gather data
            const data = {
                name: document.getElementById('name').value,
                yearly_income: parseFloat(document.getElementById('yearly_income').value),
                age_current: parseInt(document.getElementById('age_current').value),
                age_retire: parseInt(document.getElementById('age_retire').value),
                portfolio_total: parseFloat(document.getElementById('portfolio_total').value),
                monthly_benefits: parseFloat(document.getElementById('monthly_benefits').value)
            };

            try {
                // Send to Flask backend
                const response = await fetch('/calculate_gap', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    displayResults(result.data);
                } else {
                    alert(result.error);
                }
            } catch (err) {
                alert("Error connecting to the server.");
            }
        });

        function displayResults(data) {
            // Update Text
            document.getElementById('greeting').innerText = `${data.name}, here is your outlook.`;
            document.getElementById('display-age').innerText = document.getElementById('age_retire').value;
            
            // Update Numbers
            document.getElementById('target-income').innerText = currency.format(data.target_income_future);
            document.getElementById('projected-income').innerText = currency.format(data.projected_income_future);

            // Update Gap Alert Box
            const alertBox = document.getElementById('gap-message');
            if (data.is_on_track) {
                alertBox.className = 'gap-alert success';
                alertBox.innerHTML = `Great news! You have an estimated surplus of <strong>${currency.format(data.surplus)} per year</strong>.`;
            } else {
                alertBox.className = 'gap-alert warning';
                alertBox.innerHTML = `You have an estimated shortfall of <strong>${currency.format(data.shortfall)} per year</strong>. Let's optimize your strategy to close the gap.`;
            }

            // Transition UI
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
        }

        function goBack() {
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step1').style.display = 'block';
        }
    </script>
</body>
</html>
